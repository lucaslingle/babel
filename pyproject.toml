[project]
name = "babel"
version = "0.2.0"
description = "Clean LLM implementation in Jax"
readme = "README.md"
authors = [
    { name = "lucaslingle", email = "lucasdaxlingle@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "black>=25.9.0",
    "datasets>=4.1.1",
    "flax>=0.12.0",
    "gcsfs>=2025.9.0",
    "jax[tpu]>=0.7.2",
    "orbax-checkpoint>=0.11.25",
    "ml-collections>=1.1.0",
    "transformers>=4.56.2",
    "wandb>=0.22.1",
    "blobfile>=3.1.0",
    "einops>=0.8.1",
]


[project.scripts]
babel = "babel:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
